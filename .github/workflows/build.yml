name: Build & Publish cs2-tags

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
      - 'cs2-tags-example.toml'
      - 'cs2-tags-api-test/**'

jobs:
  setup:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      buildnumber: ${{ steps.buildnumber.outputs.build_number }}
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare Environment Variables
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ needs.setup.outputs.buildnumber }}" >> $GITHUB_ENV

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: |
          dotnet build cs2-tags.sln -c Release --no-restore /p:Version=1.${{ env.BUILD_NUMBER }}

      - name: Create Release Artifact (ZIP) from BuildOutput
        run: |
          mkdir -p release
          cd BuildOutput
          zip -r ../cs2-tags-v1.${{ env.BUILD_NUMBER }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ env.BUILD_NUMBER }}
          name: v1.${{ env.BUILD_NUMBER }}
          draft: false
          prerelease: false
          files: cs2-tags-v1.${{ env.BUILD_NUMBER }}.zip
          body: |
            ## Release Notes for v1.${{ env.BUILD_NUMBER }}

            ### Changes:
            - ${{ github.event.head_commit.message }}

            ### Feedback:
            - If you encounter any issues, please report them [here](https://github.com/${{ github.repository }}/issues).
